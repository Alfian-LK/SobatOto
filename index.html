<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Motorbike Troubleshooter</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">
    <h1>🏍️ Motorbike Troubleshooter</h1>

    <p>
        Answer the questions below to help identify the possible problem
        with your motorcycle.
    </p>

    <div id="chatbox"></div>

    <div id="question-area">
        <p id="question"></p>

        <button onclick="answer(true)">Yes</button>
        <button onclick="answer(false)">No</button>
    </div>

    <div id="result" class="hidden"></div>

    <button id="restart" class="hidden" onclick="restart()">
        Start Again
    </button>
</div>

<script src="engine.js"></script>
<script src="script.js"></script>

</body>
</html>
